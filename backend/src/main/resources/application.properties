# ============================================================
# AccessAble backend configuration
# ============================================================
# Database connection - Spring Boot reads these from environment variables
# using relaxed binding. Set DB_URL, DB_USERNAME, DB_PASSWORD in your shell
# or VS Code run configuration. Do NOT commit real credentials.
# See document/examples/application.properties.example and document/examples/.env.example

# Spring Boot will resolve spring.datasource.url, .username, .password
# from system environment variables (DB_URL, DB_USERNAME, DB_PASSWORD)
# using its standard property resolution mechanism.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool configuration for low-traffic student project:
# - maximum-pool-size=3: enough for simultaneous requests, conservative
# - minimum-idle=0: no forced idle connections; connections created on demand
# - idle-timeout=60s: remove idle connections after 1 minute
# - max-lifetime=3min: retire connections after 3 minutes (before external timeout)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=180000

# JPA / Hibernate: validate entities against the existing Supabase schema.
# The SQL script (document/database/schema_and_seed.sql) is the schema source of truth.
# Never use "update" — validation fails fast at startup if entities do not match SQL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Web server
server.port=${PORT:8080}

# Admin key and frontend origin (used by later milestones: protected routes + CORS)
app.admin-key=${ADMIN_KEY}
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:8001,http://127.0.0.1:8001}

# SQL logging (kept minimal; enable show-sql=true temporarily to inspect generated queries)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true